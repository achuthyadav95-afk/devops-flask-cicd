<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Project</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            text-align: center;
        }
        header { padding: 80px 20px 40px; }
        h1 { font-size: 3rem; margin: 0; color: #38bdf8; }
        p.tagline { font-size: 1.2rem; color: #94a3b8; }
        .badges { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 20px; }
        .badge { background: #1e293b; border: 1px solid #334155; padding: 10px 18px; border-radius: 20px; }
        footer { padding: 40px; color: #64748b; font-size: 0.9rem; }
        a { color: #38bdf8; }
    </style>
</head>
<body>
    <header>
        <h1>DevOps CI/CD Project</h1>
        <p class="tagline">A Flask app shipped through an automated pipeline</p>
    </header>
    <div class="badges">
        <span class="badge">Git</span>
        <span class="badge">Docker</span>
        <span class="badge">Jenkins</span>
        <span class="badge">Kubernetes</span>
        <span class="badge">Prometheus</span>
        <span class="badge">Grafana</span>
    </div>
    <footer>
        Status check: <a href="/health">/health</a>
    </footer>
</body>
</html>
